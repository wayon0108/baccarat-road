<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Baccarat Lab — Independent Research Engine</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b10;color:#e8eef5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:16px 18px;border-bottom:1px solid #1c2935;background:#0b1118;position:sticky;top:0;z-index:3}
h1{font-size:18px;margin:0}header small,.muted{color:#8191a2}.wrap{max-width:1180px;margin:auto;padding:14px}
.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:12px}.card{background:#0c131b;border:1px solid #1c2935;border-radius:14px;padding:13px;margin-bottom:12px}
.title{font-weight:800;margin-bottom:9px}.buttons{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:12px 18px;font-weight:800;font-size:16px;color:white;background:#253241}
button.b{background:#c83345}button.p{background:#2374d8}button.t{background:#27895b}button.alt{font-size:13px;padding:9px 12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.kpi{background:#111b25;border-radius:10px;padding:9px;text-align:center}.kpi small{display:block;color:#8191a2}.kpi b{font-size:18px}
.pred{font-size:42px;font-weight:900;text-align:center;padding:10px}.pred.B{color:#ff6574}.pred.P{color:#59a5ff}.pred.W{color:#93a0ad}
.meter{height:9px;background:#17232e;border-radius:9px;overflow:hidden;margin:8px 0}.meter i{display:block;height:100%;background:#8495a6}
#bead{display:grid;grid-template-columns:repeat(12,28px);gap:5px;min-height:34px}.dot{width:28px;height:28px;border:2px solid;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900}.dot.B{border-color:#e64c5e}.dot.P{border-color:#3c8ff0}.dot.T{border-color:#36a66f}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:7px;border-bottom:1px solid #1b2833;text-align:right}th:first-child,td:first-child{text-align:left}
.good{color:#62d596}.warn{color:#f3c65d}.bad{color:#ff7381}.tag{display:inline-block;padding:3px 7px;border-radius:7px;background:#17232e;font-size:11px;margin:2px}
textarea{width:100%;min-height:70px;background:#080d12;color:#dce7f2;border:1px solid #263542;border-radius:9px;padding:8px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header><h1>BACCARAT LAB <span class="muted">｜Independent Research Engine</span></h1><small>獨立設計・先驗證再採用・無有效訊號就觀望</small></header>
<div class="wrap"><div class="grid">
<section>
<div class="card"><div class="title">快速輸入</div><div class="buttons">
<button class="b" onclick="add('B')">莊 B</button><button class="p" onclick="add('P')">閒 P</button><button class="t" onclick="add('T')">和 T</button>
<button class="alt" onclick="undo()">復原</button><button class="alt" onclick="newShoe()">新靴</button>
</div></div>
<div class="card"><div class="title">珠盤</div><div id="bead"></div></div>
<div class="card"><div class="title">候選模型實驗室</div>
<div class="muted" style="font-size:12px;margin-bottom:8px">模型彼此獨立計分；只有通過最低歷史樣本要求才顯示。此處的百分比是回測統計，不是下一局真實機率。</div>
<table><thead><tr><th>模型</th><th>訊號</th><th>樣本</th><th>回測</th><th>狀態</th></tr></thead><tbody id="models"></tbody></table></div>
<div class="card"><div class="title">歷史靴資料</div>
<textarea id="importBox" placeholder="每行一靴，例如：BBPPBPBP...；只接受 B/P/T"></textarea>
<div class="buttons" style="margin-top:8px"><button class="alt" onclick="importShoes()">匯入歷史</button><button class="alt" onclick="exportData()">匯出資料</button></div>
<div id="histState" class="muted" style="margin-top:7px"></div></div>
</section>
<section>
<div class="card"><div class="title">決策引擎</div><div id="pred" class="pred W">觀望</div>
<div id="reason" style="text-align:center;font-size:13px;color:#a9b7c5">等待足夠資料</div><div class="meter"><i id="meter" style="width:0%"></i></div>
<div id="tags" style="text-align:center"></div></div>
<div class="card"><div class="title">目前靴</div><div class="kpis">
<div class="kpi"><small>局數</small><b id="n">0</b></div><div class="kpi"><small>莊</small><b id="nb">0</b></div>
<div class="kpi"><small>閒</small><b id="np">0</b></div><div class="kpi"><small>和</small><b id="nt">0</b></div></div></div>
<div class="card"><div class="title">Walk-forward 驗證</div><div class="kpis">
<div class="kpi"><small>有效預測</small><b id="vn">0</b></div><div class="kpi"><small>中</small><b id="vh">0</b></div>
<div class="kpi"><small>錯</small><b id="vm">0</b></div><div class="kpi"><small>命中率</small><b id="vr">—</b></div></div>
<div class="muted" style="font-size:12px;margin-top:8px">驗證時每一靴只能使用它之前的歷史靴，避免偷看未來資料。</div></div>
<div class="card"><div class="title">設計原則</div>
<span class="tag">B/P 分析排除和局</span><span class="tag">拒絕強制猜測</span><span class="tag">模型需最低樣本</span>
<span class="tag">Walk-forward</span><span class="tag">不把信心當勝率</span><span class="tag">本機保存</span>
</div></section></div></div>
<script>
const K='baccarat_independent_lab_v1';
let S=JSON.parse(localStorage.getItem(K)||'{"current":[],"shoes":[]}');
const bp=a=>a.filter(x=>x==='B'||x==='P'), save=()=>localStorage.setItem(K,JSON.stringify(S));
function add(x){S.current.push(x);save();render()} function undo(){S.current.pop();save();render()}
function newShoe(){if(bp(S.current).length>=8)S.shoes.push([...S.current]);S.current=[];save();render()}
function importShoes(){let a=document.getElementById('importBox').value.split(/\n+/).map(x=>x.toUpperCase().replace(/[^BPT]/g,'')).filter(x=>bp([...x]).length>=8);S.shoes.push(...a.map(x=>[...x]));save();render()}
function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='baccarat-lab-data.json';a.click()}
function simModel(cur,hist,L=10){
 cur=bp(cur); if(cur.length<L)return null; let t=cur.slice(-L),hits=[];
 hist.forEach(sh=>{sh=bp(sh);for(let e=L;e<sh.length;e++){let w=sh.slice(e-L,e),same=0;for(let i=0;i<L;i++)same+=w[i]===t[i];let s=same/L;if(s>=.7)hits.push({s,n:sh[e]})}});
 hits.sort((a,b)=>b.s-a.s);let top=hits.slice(0,60),B=top.filter(x=>x.n==='B').length,P=top.length-B,n=B+P,edge=n?Math.abs(B-P)/n:0;
 if(n<20||edge<.08)return {name:'片段相似',pick:null,n,edge,raw:top};
 return {name:'片段相似',pick:B>P?'B':'P',n,edge,raw:top}
}
function markov(cur,hist,k){
 cur=bp(cur);if(cur.length<k)return null;let key=cur.slice(-k).join(''),B=0,P=0;
 hist.forEach(sh=>{sh=bp(sh);for(let i=k;i<sh.length;i++)if(sh.slice(i-k,i).join('')===key)sh[i]==='B'?B++:P++});
 let n=B+P,edge=n?Math.abs(B-P)/n:0;return {name:`序列 ${k} 手`,pick:n>=30&&edge>=.10?(B>P?'B':'P'):null,n,edge}
}
function runLength(cur,hist){
 cur=bp(cur);if(cur.length<3)return null;let x=cur.at(-1),r=1;for(let i=cur.length-2;i>=0&&cur[i]===x;i--)r++;r=Math.min(r,5);let B=0,P=0;
 hist.forEach(sh=>{sh=bp(sh);for(let i=r;i<sh.length;i++){let ok=true;for(let j=1;j<=r;j++)if(sh[i-j]!==x)ok=false;if(ok)sh[i]==='B'?B++:P++}});
 let n=B+P,edge=n?Math.abs(B-P)/n:0;return {name:`連續結構 ${r}`,pick:n>=30&&edge>=.10?(B>P?'B':'P'):null,n,edge}
}
function models(cur,hist){return [simModel(cur,hist,10),markov(cur,hist,1),markov(cur,hist,2),markov(cur,hist,3),markov(cur,hist,4),runLength(cur,hist)].filter(Boolean)}
function decide(ms){
 let active=ms.filter(x=>x.pick); if(!active.length)return {p:null,why:'所有候選模型都未通過門檻',score:0};
 let B=active.filter(x=>x.pick==='B'),P=active.filter(x=>x.pick==='P'),best=[...active].sort((a,b)=>(b.n*b.edge)-(a.n*a.edge))[0];
 if(active.length===1)return {p:best.pick,why:`只有 ${best.name} 通過門檻`,score:Math.min(.75,best.edge+.45)};
 if(B.length===P.length)return {p:null,why:'有效模型互相衝突',score:0};
 let side=B.length>P.length?'B':'P',agree=Math.max(B.length,P.length)/active.length;
 return agree>=.67?{p:side,why:`${Math.max(B.length,P.length)}/${active.length} 個有效模型同方向`,score:agree}:{p:null,why:'模型共識不足',score:agree}
}
function backtest(){
 let n=0,h=0;
 for(let j=5;j<S.shoes.length;j++){let hist=S.shoes.slice(Math.max(0,j-5),j),seq=bp(S.shoes[j]);
  for(let i=10;i<seq.length;i++){let d=decide(models(seq.slice(0,i),hist));if(d.p){n++;if(d.p===seq[i])h++}}
 } return {n,h}
}
function render(){
 let a=S.current,B=a.filter(x=>x==='B').length,P=a.filter(x=>x==='P').length,T=a.filter(x=>x==='T').length;
 n.textContent=a.length;nb.textContent=B;np.textContent=P;nt.textContent=T;
 bead.innerHTML=a.map(x=>`<span class="dot ${x}">${x}</span>`).join('');
 histState.textContent=`已保存 ${S.shoes.length} 靴｜${S.shoes.reduce((z,x)=>z+x.length,0)} 局`;
 let hist=S.shoes.slice(-5),ms=models(a,hist),d=decide(ms),pe=document.getElementById('pred');
 pe.textContent=d.p?(d.p==='B'?'莊':'閒'):'觀望';pe.className='pred '+(d.p||'W');reason.textContent=d.why;meter.style.width=(d.score*100)+'%';
 tags.innerHTML=ms.filter(x=>x.pick).map(x=>`<span class="tag">${x.name}→${x.pick==='B'?'莊':'閒'}</span>`).join('');
 modelsEl=document.getElementById('models');modelsEl.innerHTML=ms.map(x=>`<tr><td>${x.name}</td><td>${x.pick?(x.pick==='B'?'莊':'閒'):'—'}</td><td>${x.n}</td><td>${x.n?((.5+x.edge/2)*100).toFixed(1)+'%票差側':'—'}</td><td class="${x.pick?'good':'warn'}">${x.pick?'有效':'觀望'}</td></tr>`).join('');
 let v=backtest();vn.textContent=v.n;vh.textContent=v.h;vm.textContent=v.n-v.h;vr.textContent=v.n?(v.h/v.n*100).toFixed(2)+'%':'—'
}
render();
</script></body></html>
