<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>百家樂走勢</title>
<style>
:root{
  --bg1:#087153; --bg2:#01513d; --deep:#004634; --line:#27c98f;
  --gold:#ffe28a; --red:#ff2438; --blue:#0b84f6; --tie:#0bb660;
  --ink:#14242f; --muted:#66747d; --white:#fff; --grid:#d8dedb;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg2);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",Arial,sans-serif;overflow-x:hidden}
body{color:#fff}
.app{min-height:100vh;padding:10px;background:linear-gradient(135deg,var(--bg1),var(--bg2))}
.header{
  display:grid;grid-template-columns:320px 1fr 145px 145px 145px 175px 58px;
  gap:10px;align-items:center;margin-bottom:8px
}
.brand{display:flex;align-items:center;gap:10px;color:var(--gold);font-weight:900}
.spade{font-size:60px;line-height:1}.brand-cn{font-size:34px}.brand-en{font-size:13px;letter-spacing:3px}
.topbox{height:60px;border:2px solid #29c492;border-radius:14px;background:rgba(0,73,55,.65);display:flex;align-items:center;justify-content:center;font-weight:900}
.current{justify-content:flex-start;padding:0 18px;font-size:22px}
.counter{font-size:25px;gap:16px}.counter b{font-size:30px}
.bank{background:linear-gradient(#d71c2c,#a90f1b)}.player{background:linear-gradient(#0f8cf8,#075daf)}.tie{background:linear-gradient(#10b765,#08723f)}
.clock{flex-direction:column;font-size:13px}.clock b{font-size:24px}
.settings{font-size:25px}

.main{display:grid;grid-template-columns:290px minmax(0,1fr);gap:8px}
.controls{background:#fff;color:#111;border:2px solid #2fc890;border-radius:12px;padding:10px}
.controls h3{margin:0 0 8px;font-size:20px}
.result-btn{width:100%;height:58px;border:0;border-radius:12px;color:#fff;font-size:30px;font-weight:900;margin-bottom:6px}
.rb{background:linear-gradient(#ff2f46,#ef2135)}.pb{background:linear-gradient(#1999ff,#0877df)}.tb{background:linear-gradient(#13c66d,#05a654)}
.twobtn{display:grid;grid-template-columns:1fr 1fr;gap:8px}.twobtn button{height:52px;border:0;border-radius:12px;background:#eef2f6;font-size:22px;font-weight:900;color:#10224a}
.checks{display:flex;justify-content:space-around;margin:13px 0;font-size:17px}.checks input{width:23px;height:23px;vertical-align:middle}
.undo{width:100%;height:54px;border:0;border-radius:13px;background:#dff3eb;color:#143547;font-size:24px;font-weight:900}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}.actions button{height:48px;border:0;border-radius:10px;font-weight:900}.save{background:#078c66;color:#fff}.clear{background:#1c2328;color:#fff}

.roads{display:grid;grid-template-columns:1fr 1.45fr;grid-template-rows:305px 178px;gap:8px;min-width:0}
.road{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;min-width:0}
.road h4{height:38px;margin:0;padding:7px 12px;background:linear-gradient(180deg,#0b684f,#00503e);font-size:18px}
.canvaswrap{height:calc(100% - 38px);overflow:hidden;background:#fff}.canvaswrap canvas{width:100%;height:100%;display:block}
.minis{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}

.panel{background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:12px}
.analysis{margin-top:8px;padding:12px;display:grid;grid-template-columns:300px 170px repeat(5,1fr);align-items:center;gap:12px}
.analysis-title{font-size:24px;font-weight:900}.analysis-btn{height:56px;border:0;border-radius:10px;background:#78909e;color:#fff;font-size:20px;font-weight:900}
.metric{padding-left:12px;border-left:1px solid #ccd4d8;font-size:14px}.metric b{font-size:20px}

.connect{margin-top:8px;padding:12px}.connect-head{display:flex;justify-content:space-between;align-items:center}.connect-title{font-size:24px;font-weight:900}.connect-sub{font-size:12px;color:#617079;margin-top:2px}.status{padding:7px 13px;border-radius:20px;background:#f1f4f3}
.connect-grid{display:grid;grid-template-columns:220px 1fr 165px 165px;gap:8px;margin-top:10px}
.connect-grid input,.connect-grid select,.subgrid input,.subgrid select{height:42px;border:1px solid #d6dde0;border-radius:10px;padding:0 10px}
.connbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.connbtns button{height:42px;border:0;border-radius:10px;font-weight:900}.start{background:#0a9567;color:#fff}.stop{background:#2f353a;color:#fff}
.subgrid{display:grid;grid-template-columns:220px 170px 1fr 110px 110px 110px;gap:8px;margin-top:8px}.subgrid button{border:0;border-radius:10px;background:#e9edf0;font-weight:900}
.log{margin-top:8px;background:#142630;color:#55dfb8;border-radius:8px;min-height:74px;padding:10px;font-size:13px}

@media(max-width:900px){
  .app{padding:4px}
  .header{grid-template-columns:1fr 70px 70px 70px;gap:4px}.brand{grid-column:1/-1}.brand-cn{font-size:24px}.spade{font-size:40px}.brand-en{font-size:10px}.current,.clock,.settings{display:none}.topbox{height:44px}.counter{font-size:14px;gap:4px}.counter b{font-size:20px}
  .main{grid-template-columns:105px minmax(0,1fr);gap:4px}.controls{padding:5px}.controls h3{font-size:12px}.result-btn{height:38px;font-size:20px}.twobtn button{height:34px;font-size:14px}.checks{font-size:11px;margin:5px 0}.checks input{width:14px;height:14px}.undo{height:34px;font-size:14px}.actions{gap:2px}.actions button{height:32px;font-size:11px}
  .roads{grid-template-columns:1fr 1.45fr;grid-template-rows:180px 100px;gap:4px}.road h4{height:28px;font-size:12px;padding:5px 7px}.canvaswrap{height:calc(100% - 28px)}.minis{gap:4px}
  .analysis{grid-template-columns:1fr 90px 1fr 1fr;gap:5px;padding:7px}.analysis-title{font-size:15px}.analysis-btn{height:40px;font-size:12px}.metric{font-size:10px;padding-left:4px}.metric b{font-size:13px}
  .connect{padding:7px}.connect-title{font-size:15px}.connect-sub{font-size:9px}.connect-grid{grid-template-columns:120px 1fr 90px 90px;gap:4px}.connect-grid input,.connect-grid select{height:34px;font-size:11px}.connbtns button{height:34px;font-size:10px}.subgrid{grid-template-columns:120px 90px 1fr 70px 70px 70px;gap:4px}.subgrid input,.subgrid select{height:34px;font-size:11px}.subgrid button{font-size:9px}.log{font-size:9px;min-height:60px}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="brand">
      <div class="spade">♠</div>
      <div><div class="brand-cn">百家樂走勢</div><div class="brand-en">BACCARAT ROADMAP</div></div>
    </div>
    <div class="topbox current">本局結果：<span id="last">- - -</span></div>
    <div class="topbox counter bank">莊 <b id="bCount">0</b></div>
    <div class="topbox counter player">閒 <b id="pCount">0</b></div>
    <div class="topbox counter tie">和 <b id="tCount">0</b></div>
    <div class="topbox clock"><span id="date"></span><b id="time"></b></div>
    <div class="topbox settings">⚙</div>
  </div>

  <div class="main">
    <div class="controls">
      <h3>輸入本局結果</h3>
      <button class="result-btn rb" onclick="add('B')">莊</button>
      <button class="result-btn pb" onclick="add('P')">閒</button>
      <button class="result-btn tb" onclick="add('T')">和</button>
      <div class="twobtn"><button onclick="add('B6')">莊 6</button><button onclick="add('P6')">閒 6</button></div>
      <div class="checks"><label><input type="checkbox" id="bp"> 莊對</label><label><input type="checkbox" id="pp"> 閒對</label></div>
      <button class="undo" onclick="undo()">上一步</button>
      <div class="actions"><button class="save" onclick="saveData()">儲存</button><button onclick="loadData()">讀取</button><button class="clear" onclick="clearAll()">清空</button></div>
    </div>

    <div class="roads">
      <div class="road"><h4>珠盤路</h4><div class="canvaswrap"><canvas id="bead"></canvas></div></div>
      <div class="road"><h4>大路</h4><div class="canvaswrap"><canvas id="big"></canvas></div></div>
      <div class="minis">
        <div class="road"><h4>大眼仔</h4><div class="canvaswrap"><canvas id="eye"></canvas></div></div>
        <div class="road"><h4>小路</h4><div class="canvaswrap"><canvas id="small"></canvas></div></div>
        <div class="road"><h4>甲由路</h4><div class="canvaswrap"><canvas id="cock"></canvas></div></div>
        <div class="road"><h4>下一手問路</h4><div class="canvaswrap"><canvas id="ask"></canvas></div></div>
      </div>
    </div>
  </div>

  <div class="panel analysis">
    <div class="analysis-title">▮▮ 走勢統計演算法</div>
    <button class="analysis-btn" onclick="renderPrediction()">開始分析</button>
    <div class="metric">莊機率<br><b id="probB">50.0%</b></div>
    <div class="metric">閒機率<br><b id="probP">50.0%</b></div>
    <div class="metric">和機率<br><b id="probT">0.0%</b></div>
    <div class="metric">模型信心<br><b id="confidence">0%</b></div>
    <div class="metric">有效樣本<br><b id="samples">0 局</b></div>
  </div>

  <div class="panel connect">
    <div class="connect-head">
      <div>
        <div class="connect-title">◉ Allbet / 百家樂資料接入</div>
        <div class="connect-sub">支援 HTTP / JSON / CSV / WebSocket · 只要貼上網址即可自動接資料</div>
      </div>
      <div class="status">● <span id="connStatus">未連線</span></div>
    </div>

    <div class="connect-grid">
      <select id="sourceType"><option value="http">HTTP / JSON / CSV</option><option value="ws">WebSocket</option></select>
      <input id="endpoint" placeholder="貼上 API 或 WebSocket 網址">
      <div class="connbtns"><button class="start" onclick="connectSource()">▶ 開始連線</button><button class="stop" onclick="disconnectSource()">■ 停止</button></div>
      <input id="tableFilter" value="B219" placeholder="桌號，例如 B219">
    </div>

    <div class="subgrid">
      <input id="tableMirror" value="B219" placeholder="桌號">
      <select id="pollMs"><option value="3000">3 秒</option><option value="1000">1 秒</option><option value="5000">5 秒</option></select>
      <input id="resultField" placeholder="結果欄位名稱（可留空自動辨識）">
      <button onclick="testFeed()">測試一局</button>
      <button onclick="exportData()">匯出資料</button>
      <button onclick="document.getElementById('importFile').click()">匯入資料</button>
    </div>
    <input id="importFile" type="file" accept=".json,.csv" style="display:none" onchange="importDataFile(event)">
    <div id="log" class="log">[系統] 程式已就緒，現在可手動輸入莊/閒/和；或連接平台資料後開始自動更新。</div>
  </div>
</div>

<script>
let data = JSON.parse(localStorage.getItem('baccaratData')||'[]');
let timer=null, ws=null, seen=new Set();
function base(r){return r[0]}
function color(r){return base(r)==='B'?'#ef2335':base(r)==='P'?'#087cf0':'#08a95b'}
function add(r){data.push({r,bp:bp.checked,pp:pp.checked});bp.checked=pp.checked=false;persist();render()}
function undo(){data.pop();persist();render()}
function clearAll(){if(confirm('確定清空全部資料？')){data=[];persist();render()}}
function persist(){localStorage.setItem('baccaratData',JSON.stringify(data))}
function saveData(){persist();alert('已儲存')}
function loadData(){data=JSON.parse(localStorage.getItem('baccaratData')||'[]');render()}

function tick(){const d=new Date();date.textContent=d.toLocaleDateString('zh-TW');time.textContent=d.toLocaleTimeString('zh-TW',{hour12:false})}
setInterval(tick,1000);tick();

function setup(id,cell){
  const c=document.getElementById(id),r=c.parentElement.getBoundingClientRect(),d=devicePixelRatio||1;
  c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);
  x.fillStyle='#fff';x.fillRect(0,0,r.width,r.height);x.strokeStyle='#d8dedb';x.lineWidth=.7;
  for(let i=0;i<=r.width;i+=cell){x.beginPath();x.moveTo(i,0);x.lineTo(i,r.height);x.stroke()}
  for(let i=0;i<=r.height;i+=cell){x.beginPath();x.moveTo(0,i);x.lineTo(r.width,i);x.stroke()}
  return {x,w:r.width,h:r.height}
}
function drawBead(){
  const {x,h}=setup('bead',30),rows=Math.max(1,Math.floor(h/30));
  data.forEach((v,i)=>{const c=Math.floor(i/rows),r=i%rows,cx=c*30+15,cy=r*30+15;x.fillStyle=color(v.r);x.beginPath();x.arc(cx,cy,12,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.font='bold 14px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(v.r.includes('6')?'6':base(v.r)==='B'?'莊':base(v.r)==='P'?'閒':'和',cx,cy)})
}
function bigPositions(){
  const arr=data.filter(v=>base(v.r)!=='T');let out=[],col=-1,row=0,last=null;
  for(const v of arr){const r=base(v.r);if(r!==last){col++;row=0}else row=Math.min(5,row+1);out.push({r,col,row});last=r}
  return out
}
function drawBig(){const {x}=setup('big',34);bigPositions().forEach(v=>{const cx=v.col*34+17,cy=v.row*34+17;x.strokeStyle=color(v.r);x.lineWidth=3;x.beginPath();x.arc(cx,cy,12,0,Math.PI*2);x.stroke()})}
function derived(offset){const a=bigPositions(),out=[];for(let i=offset+2;i<a.length;i++){const p=a[i-1],c=a[i];out.push(((c.row===p.row)||(c.col-p.col===1&&c.row===0))?'R':'B')}return out}
function drawDerived(id,arr,type){
  const {x,h}=setup(id,22),rows=Math.max(1,Math.floor(h/22));
  arr.forEach((v,i)=>{const c=Math.floor(i/rows),r=i%rows,cx=c*22+11,cy=r*22+11;x.strokeStyle=x.fillStyle=v==='R'?'#ef2335':'#087cf0';x.lineWidth=2;
    if(type==='slash'){x.beginPath();x.moveTo(cx-6,cy+6);x.lineTo(cx+6,cy-6);x.stroke()}
    else if(type==='dot'){x.beginPath();x.arc(cx,cy,5,0,Math.PI*2);x.fill()}
    else{x.beginPath();x.arc(cx,cy,7,0,Math.PI*2);x.stroke()}
  })
}
function drawAsk(){const {x}=setup('ask',22);for(let j=0;j<2;j++)for(let i=0;i<10;i++){const cx=i*22+11,cy=j*22+11;x.strokeStyle=(i+j)%2?'#ef2335':'#087cf0';x.lineWidth=2;x.beginPath();x.arc(cx,cy,7,0,Math.PI*2);x.stroke()}}
function stats(){
  const B=data.filter(v=>base(v.r)==='B').length,P=data.filter(v=>base(v.r)==='P').length,T=data.filter(v=>base(v.r)==='T').length,n=data.length;
  bCount.textContent=B;pCount.textContent=P;tCount.textContent=T;
  last.textContent=n?(base(data[n-1].r)==='B'?'莊':base(data[n-1].r)==='P'?'閒':'和'):'- - -';
  probB.textContent=(n?B/n*100:50).toFixed(1)+'%';probP.textContent=(n?P/n*100:50).toFixed(1)+'%';probT.textContent=(n?T/n*100:0).toFixed(1)+'%';samples.textContent=n+' 局'
}
function renderPrediction(){
  const a=data.map(v=>base(v.r)).filter(r=>r!=='T');if(a.length<8){confidence.textContent='0%';return}
  let B=0,P=0;for(let n=1;n<=3;n++){const pat=a.slice(-n).join('');for(let i=0;i<a.length-n;i++)if(a.slice(i,i+n).join('')===pat){a[i+n]==='B'?B++:P++}}
  const total=B+P;confidence.textContent=(total?Math.min(90,Math.round(50+Math.abs(B-P)/total*40)):0)+'%'
}
function render(){drawBead();drawBig();drawDerived('eye',derived(1),'circle');drawDerived('small',derived(2),'dot');drawDerived('cock',derived(3),'slash');drawAsk();stats();renderPrediction()}
window.addEventListener('resize',render);

function normalizeResult(v){
  if(v==null)return null;const s=String(v).trim().toLowerCase();
  if(['b','banker','莊','庄'].includes(s)||s.includes('banker'))return 'B';
  if(['p','player','閒','闲'].includes(s)||s.includes('player'))return 'P';
  if(['t','tie','和'].includes(s)||s.includes('tie'))return 'T';return null
}
function pick(o,names){for(const n of names)if(o&&Object.prototype.hasOwnProperty.call(o,n))return o[n]}
function rows(p){if(Array.isArray(p))return p;if(p&&Array.isArray(p.data))return p.data;if(p&&Array.isArray(p.results))return p.results;if(p&&Array.isArray(p.items))return p.items;return [p]}
function processPayload(payload){
  const target=(tableFilter.value||tableMirror.value||'').trim().toLowerCase();let added=0;
  for(const row of rows(payload)){if(!row||typeof row!=='object')continue;const table=pick(row,['table','tableId','table_id','tableNo','desk','room']);if(target&&String(table??'').toLowerCase()!==target)continue;
    const rf=resultField.value.trim();const raw=rf?row[rf]:pick(row,['result','winner','side','gameResult','game_result','outcome','win']);const r=normalizeResult(raw);if(!r)continue;
    const id=pick(row,['id','gameId','game_id','roundId','round_id','serial','issue'])??JSON.stringify(row);const key=String(id);if(seen.has(key))continue;seen.add(key);data.push({r,source:'auto'});added++}
  if(added){persist();render();logmsg(`新增 ${added} 局，自動更新走勢`)}
}
function logmsg(m){const t=new Date().toLocaleTimeString('zh-TW',{hour12:false});log.innerHTML+=`<div>[${t}] ${m}</div>`;log.scrollTop=log.scrollHeight}
async function poll(){
  try{const res=await fetch(endpoint.value.trim(),{cache:'no-store',credentials:'include'});if(!res.ok)throw new Error('HTTP '+res.status);let payload;const ct=res.headers.get('content-type')||'';payload=ct.includes('json')?await res.json():JSON.parse(await res.text());processPayload(payload);connStatus.textContent='已連線'}catch(e){connStatus.textContent='連線失敗';logmsg(e.message)}
}
function connectSource(){
  disconnectSource(false);const url=endpoint.value.trim();if(!url){alert('請先貼上網址');return}
  if(sourceType.value==='ws'){try{ws=new WebSocket(url);connStatus.textContent='連線中';ws.onopen=()=>{connStatus.textContent='已連線';logmsg('WebSocket 已連線')};ws.onmessage=e=>{try{processPayload(JSON.parse(e.data))}catch{}};ws.onclose=()=>connStatus.textContent='已停止'}catch(e){logmsg(e.message)}}
  else{poll();timer=setInterval(poll,Number(pollMs.value)||3000);logmsg('開始自動抓取')}
}
function disconnectSource(write=true){if(timer){clearInterval(timer);timer=null}if(ws){try{ws.close()}catch{}ws=null}connStatus.textContent='已停止';if(write)logmsg('已停止')}
function testFeed(){data.push({r:Math.random()>.5?'B':'P'});persist();render()}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='baccarat-data.json';a.click()}
function importDataFile(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const v=JSON.parse(rd.result);if(Array.isArray(v)){data=v;persist();render()}}catch{alert('檔案格式錯誤')}};rd.readAsText(f)}
render();
</script>
</body>
</html>
